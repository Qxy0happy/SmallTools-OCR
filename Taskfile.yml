version: "3"

tasks:
  default:
    desc: 格式检查、lint 与测试
    cmds:
      - task: check

  fmt:
    desc: 用 gofumpt 格式化 Go 源码
    cmds:
      - golangci-lint fmt ./...

  build:
    desc: 构建 ./bin/mineru-ocr
    cmds:
      - mkdir -p bin
      - go build -trimpath -o bin/mineru-ocr ./cmd/mineru-ocr

  fmt:check:
    desc: 只检查不改写，存在未格式化文件即失败
    cmds:
      - golangci-lint fmt --diff ./...

  lint:
    desc: 用 revive 做静态检查
    cmds:
      - golangci-lint run ./...

  test:
    desc: 跑单元测试
    cmds:
      - go test ./...

  e2e:
    desc: 跑真实服务端到端测试（需要 uv、MinerU 项目与本地模型）
    cmds:
      - go test -tags=e2e ./internal/e2e -v -timeout 900s

  check:
    desc: CI 会跑的全部检查
    cmds:
      - task: fmt:check
      - task: lint
      - task: test
